<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect width="56" height="56" rx="12" fill="url(#logoGradient)"/>

  <!-- Mail envelope body -->
  <rect x="10" y="16" width="36" height="26" rx="3" fill="white"/>

  <!-- Mail envelope flap (triangle) -->
  <path d="M10 19L28 31L46 19" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Deck lines (stacked cards effect) -->
  <rect x="14" y="12" width="28" height="4" rx="2" fill="white" fill-opacity="0.6"/>
  <rect x="18" y="8" width="20" height="4" rx="2" fill="white" fill-opacity="0.4"/>

  <!-- Notification dot -->
  <circle cx="44" cy="14" r="6" fill="#EF4444" stroke="white" stroke-width="2"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
</svg>
