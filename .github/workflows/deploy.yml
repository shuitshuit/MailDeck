name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to OCI Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy backend via rsync
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='logs/' \
            --exclude='*.json.key' \
            --exclude='maildeck-*.json' \
            ./backend-build/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/maildeck/build/

      - name: Deploy frontend via rsync
        run: |
          rsync -avz --delete \
            ./frontend-build/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/maildeck/

      - name: Restart API service
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo systemctl restart maildeck-api.service && sudo systemctl is-active maildeck-api.service"

      - name: Health check
        run: |
          sleep 5
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "curl -sf http://localhost:5000/health || (sudo journalctl -u maildeck-api -n 30 --no-pager && exit 1)"
