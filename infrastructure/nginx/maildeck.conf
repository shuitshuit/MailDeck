# MailDeck nginx configuration
# Place this file in /etc/nginx/sites-available/maildeck.conf
# Enable with: sudo ln -s /etc/nginx/sites-available/maildeck.conf /etc/nginx/sites-enabled/

# Cloudflare IP ranges for real_ip_header
# https://www.cloudflare.com/ips/
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Use CF-Connecting-IP header for real client IP
real_ip_header CF-Connecting-IP;

# HTTPS server (main configuration)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maildeck.shuit.net;

    # SSL certificates (Cloudflare Origin Certificate)
    ssl_certificate /etc/ssl/certs/maildeck.shuit.net.pem;
    ssl_certificate_key /etc/ssl/private/maildeck.shuit.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Frontend - Serve static files from /var/www/html
    root /var/www/html;
    index index.html;

    # Logs
    access_log /var/log/nginx/maildeck-access.log;
    error_log /var/log/nginx/maildeck-error.log;

    # Static assets - serve directly without fallback
    location /assets/ {
        try_files $uri =404;
    }

    # Frontend routes - SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API - Reverse proxy to ASP.NET Core
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;

        # WebSocket support (for potential future use)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare headers passthrough
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Ray $http_cf_ray;

        # Timeouts for long-running requests (e.g., IMAP operations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name maildeck.shuit.net;
    return 301 https://$server_name$request_uri;
}
