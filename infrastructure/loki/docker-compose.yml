# maildeck鯖用: Lokiのみ
# Grafanaはローカルサーバーで稼働
services:
  loki:
    image: grafana/loki:3.4.1
    container_name: maildeck-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped

volumes:
  loki-data:
